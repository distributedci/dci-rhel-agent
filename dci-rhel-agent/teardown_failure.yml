---
- name: 'Add job state failure'
  delegate_to: localhost
  dci_job:
    id: "{{ hostvars.localhost.job_id }}"
    status: "failure"
  tags: dci

# When a localhost play fails, the 'fail' below removes localhost from the run
# and the post-run 'Grab logs' play never executes, so the logs have to be
# collected here.  When a SUT play fails only that host is removed, 'Grab logs'
# still runs on localhost, and collecting here instead would upload a partial
# set and delete the temp directories while the other SUTs are still installing.
- name: 'Collect logs on failure'
  delegate_to: localhost
  when:
    - "'sut' not in group_names"
    - not hostvars.localhost.logs_collected | default(false) | bool
  block:
    - name: 'Create temp dir if necessary'
      include_tasks: create_temp_dir.yml
      when: hostvars.localhost.job_logs is not defined

    - name: 'Upload failure logs to DCI Control Server'
      include_tasks: logs.yml
  rescue:
    - name: 'Log collection failed after job failure'
      debug:
        msg: 'Warning: Could not collect logs after job failure'

- name: 'Failed job'
  fail:
    msg: 'Something went wrong. Review the log at: https://www.distributed-ci.io/jobs/{{ hostvars.localhost.job_id }}/jobStates'
