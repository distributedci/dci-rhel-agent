---
#
# Configure conserver on the jumpbox so that every system with a sol_command
# gets its console captured to /var/consoles/<fqdn>.
#
# Included from the 'Setup Conserver for Console Logging' play, which runs on
# localhost; every task here delegates to the jumpbox.
#
- name: Setup conserver for console logging
  # A rescue does not catch an unreachable host, so without this an unreachable
  # jumpbox would fail the job even though console logging is optional.
  ignore_unreachable: true
  block:
    # conserver and conserver-client come from the dci-rhel-agent package, but
    # the program a sol_command names is free form, so it can only be checked
    # for.  Without this a missing program gives a console log that is empty or
    # holds nothing but a 'command not found', with no indication of why.
    - name: Work out which programs the SOL commands need
      set_fact:
        sol_programs: >-
          {{ systems | dict2items
             | selectattr('value.sol_command', 'defined')
             | map(attribute='value.sol_command')
             | map('trim')
             | map('regex_replace', '\s.*$', '')
             | map('basename')
             | unique | list }}

    - name: Check that every SOL program is present on the jumpbox
      shell: "command -v {{ item | quote }}"
      changed_when: false
      failed_when: false
      register: sol_program_check
      loop: "{{ sol_programs }}"
      delegate_to: jumpbox

    - name: Warn about SOL programs that are missing from the jumpbox
      debug:
        msg: >-
          Warning: '{{ item.item }}' is not installed on the jumpbox, so the
          SOL command using it cannot run and its console log will be empty.
      loop: "{{ sol_program_check.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.rc | default(0) != 0

    - name: Clear console logs left over from a previous job
      file:
        path: /var/consoles
        state: absent
      become: yes
      delegate_to: jumpbox

    - name: Create /var/consoles
      file:
        path: /var/consoles
        state: directory
        mode: '0755'
        owner: root
        group: root
      become: yes
      delegate_to: jumpbox

    # Each sol_command is written into this file verbatim, BMC password and
    # all, and conserver reads it as root, so it is not world readable.
    - name: Create conserver.cf file
      template:
        src: conserver.cf.j2
        dest: /etc/conserver.cf
        owner: root
        group: root
        mode: 0600
      become: yes
      delegate_to: jumpbox

    - name: Start and enable conserver with a fresh set of log files
      service:
        name: conserver
        state: restarted
        enabled: yes
      become: yes
      delegate_to: jumpbox

    - name: Conserver setup completed successfully
      debug:
        msg: "Conserver setup completed - console logging is now active with fresh log files"

  rescue:
    - name: Conserver setup failed
      debug:
        msg: "Warning: Conserver setup failed, console logging will not be available but job will continue"
